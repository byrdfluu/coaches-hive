<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Coaches Hive</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body, table, td, p, a { font-family: Arial, Helvetica, sans-serif; }
    h1, h2, h3, p { margin-top: 0; }
    a { color: #b80f0a; }
    .button { display: inline-block; padding: 14px 22px; border-radius: 12px; background: #b80f0a; color: #ffffff !important; font-weight: 700; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      .email-page { background-color: #171717 !important; }
      .email-card { background-color: #232427 !important; border-color: #3b3e45 !important; }
      .email-body, .email-body h1, .email-body h2, .email-body h3, .email-body p, .email-body strong { color: #ffffff !important; }
      .email-footer { background-color: #1d1e21 !important; border-color: #3b3e45 !important; }
      .email-muted, .email-muted a { color: #c9c9c9 !important; }
      .button { background-color: #d71914 !important; color: #ffffff !important; }
    }
    @media (max-width: 640px) {
      .email-page-pad { padding: 20px 12px !important; }
      .email-header, .email-body, .email-footer { padding-left: 22px !important; padding-right: 22px !important; }
      .wordmark { font-size: 23px !important; line-height: 23px !important; }
    }
  </style>
</head>
<body class="email-page" style="margin:0;padding:0;background:#f5f5f5;background-image:linear-gradient(#f5f5f5,#f5f5f5);-webkit-text-size-adjust:100%;">
  <table class="email-page" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#f5f5f5;background-image:linear-gradient(#f5f5f5,#f5f5f5);">
    <tr><td class="email-page-pad" align="center" style="padding:32px 16px;">
      <table class="email-card" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e0e0e0;border-radius:16px;overflow:hidden;">
        <tr><td class="email-header" bgcolor="#b80f0a" style="padding:22px 32px;background:#b80f0a;background-image:linear-gradient(#b80f0a,#b80f0a);">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td valign="middle" style="padding-right:12px;"><img src="https://www.coacheshive.com/CHLogoTransparent.PNG" alt="" width="38" height="38" style="display:block;width:38px;height:38px;border:0;"></td>
            <td valign="middle" style="font-size:0;line-height:0;white-space:nowrap;"><span class="wordmark" style="display:inline-block;font-size:25px;line-height:25px;font-weight:800;letter-spacing:.5px;color:#ffffff;">COACHES</span><span class="wordmark" style="display:inline-block;font-size:25px;line-height:25px;font-weight:800;letter-spacing:.5px;color:#191919;">HIVE</span></td>
          </tr></table>
        </td></tr>
        <tr><td class="email-body" style="padding:32px;color:#191919;font-size:15px;line-height:1.6;">{{{ @content }}}</td></tr>
        <tr><td class="email-footer" style="padding:20px 32px;background:#f9f9f9;border-top:1px solid #e0e0e0;">
          <p class="email-muted" style="margin:0;color:#666666;font-size:12px;">© Coaches Hive &nbsp;·&nbsp; <a href="https://coacheshive.com" style="color:#666666;text-decoration:none;">coacheshive.com</a></p>
          <p class="email-muted" style="margin:6px 0 0;color:#666666;font-size:12px;">Questions? <a href="mailto:support@coacheshive.com" style="color:#666666;">support@coacheshive.com</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
